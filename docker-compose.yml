# Local Postgres for development: `docker compose up -d`
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: moozer
      POSTGRES_PASSWORD: moozer
      POSTGRES_DB: moozer
    ports:
      # 5433 on this machine, so Moozer can run beside other projects using 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moozer -d moozer"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
